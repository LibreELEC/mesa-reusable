name: yml-build-mesa-host
on:
  workflow_call:
    inputs:
      runner:
        description: "set runs-on for host arch"
        required: true
        type: string
      debug:
        description: "Provide debug output from GHA run"
        #default: no_debug
        required: true
        type: string
      ephemeral:
        description: "Target and build-root are ephemeral"
        #default: ephemeral
        required: true
        type: string
      upload_url:
        description: "Release upload url"
        required: true
        type: string
      buildcmd:
        description: "build command to run"
        #default: "make image"
        required: true
        type: string
      gitref:
        description: "git branch or hash to build"
        #default: libreelec-13.0
        required: true
        type: string
      group:
        description: "concurrency group"
        #default: Generic_x86_64-10_0
        required: true
        type: string
      project:
        description: "target project"
        #default: Generic
        required: true
        type: string
      arch:
        description: "target arch"
        #default: x86_64
        required: true
        type: string
      device:
        description: "target device"
        default: ""
        required: false
        type: string
      targetbuilddir:
        description: "TARGETBUILDDIR"
        #default: ""
        required: true
        type: string
      version:
        description: "version code used in TARGETBUILDDIR"
        required: true
        type: string
      mesa:
        description: "mesa version we are building"
        required: true
        type: string
      buildos:
        description: "docker image to build with"
        required: true
        type: string

env:
  BASEDIR: /var/media/DATA/github-actions
  # Distro Target Variables
  PROJECT: ${{ inputs.project }}
  ARCH: ${{ inputs.arch }}
  DEVICE: ${{ inputs.device }}
  TARGETBUILDDIR: ${{ inputs.targetbuilddir }}
  LE_DISTRO_VERSION: ${{ inputs.version }}
  MESA_VERSION: ${{ inputs.mesa }}
  BUILD_OS: ${{ inputs.buildos }}

concurrency:
  group: ${{ inputs.group }}
  cancel-in-progress: false

jobs:
  build_image:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.gitref }}
          fetch-depth: 2
          repository: "${{ github.repository_owner }}/LibreELEC.tv"
          path: "LibreELEC.tv"

      - name: Customise the checked out git repository
        run: |
          cd LibreELEC.tv
          sed -i -e "s/RUN adduser/RUN adduser --uid $(id -u)/" tools/docker/jammy/Dockerfile
          sed -i -e "s/RUN useradd docker/RUN useradd docker -o -u $(id -u)/" tools/docker/noble/Dockerfile
          sed -i -e "s/RUN useradd docker/RUN useradd docker -o -u $(id -u)/" tools/docker/resolute/Dockerfile
          sed -i -e 's/BUILD_REUSABLE=""/BUILD_REUSABLE="mesa:host"/' distributions/LibreELEC/options

      - name: Create docker image for build
        run: |
          cd LibreELEC.tv
          echo "Building with ${{ env.BUILD_OS }}"
          docker build --pull -t gh-${{ github.run_id }} tools/docker/${{ env.BUILD_OS }}

      - name: Prepare the LibreELEC.tv directory - do not leave files behind
        if: inputs.ephemeral == 'ephemeral'
        run: |
          cd LibreELEC.tv
          # set the build_dir=/build
          echo "build_dir=/build" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV

      - name: Display environment
        if: inputs.debug == 'debug'
        run: |
          cd LibreELEC.tv
          echo "pwd: $(pwd)"
          echo "id: $(id)"
          echo "whoami: $(whoami)"
          echo "docker images: $(docker images)"
          echo ""
          echo "inputs.debug: ${{ inputs.debug }}"
          echo "inputs.ephemeral: ${{ inputs.ephemeral }}"
          echo ""
          echo "lscpu:"
          lscpu

      - name: Build LE in docker container
        run: |
          cd LibreELEC.tv
          docker run --rm -v `pwd`:/build \
                          -w /build -i \
                          -e PROJECT=${{ env.PROJECT }} \
                          -e ARCH=${{ env.ARCH }} \
                          -e DEVICE=${{ env.DEVICE }} \
                          -e ONELOG=no -e LOGCOMBINE=fail \
                          -e BUILD_DIR=${{ env.build_dir }} \
                          -e BUILD_PERIODIC=nightly \
                          -e CCACHE_DISABLE=${{ env.CCACHE_DISABLE }} \
                          gh-${{ github.run_id }} ${{ inputs.buildcmd }} ${{ env.NOOBS }}
        continue-on-error: true

      - name: Prepare artifacts - ephemeral
        if: inputs.ephemeral == 'ephemeral'
        run: |
          cd LibreELEC.tv
          mkdir -p ${{ env.TARGETBUILDDIR }}/artifact
          grep ^FAIL ${{ env.TARGETBUILDDIR }}/.threads/joblog | \
            awk '{ print $5, $12 }' | tr ':' '_' | \
              while read failedpkg failedlog; do
                mv $(echo ${failedlog} | sed 's#/build/##') \
                  ${{ env.TARGETBUILDDIR }}/artifact/${{ env.TARGETBUILDDIR }}-${failedpkg}-$(echo ${failedlog} | sed 's#.*/##')
              done

      - name: Upload failed artifacts - ephemeral
        if: inputs.ephemeral == 'ephemeral'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.group }}-failed
          path: LibreELEC.tv/${{ env.TARGETBUILDDIR }}/artifact/
          if-no-files-found: ignore

      - name: Collect failed build information
        id: failures
        run: |
          joblog="LibreELEC.tv/${{ env.TARGETBUILDDIR }}/.threads/joblog"
          failed_lines=$(grep ^FAIL "${joblog}" 2>/dev/null || true)
          title="${{ env.PROJECT }}.${{ env.ARCH }}-mesa-${{ env.MESA_VERSION }}"
          if [ -z "${failed_lines}" ]; then
            echo "has_failures=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          planfile="${joblog%/joblog}/plan.json"
          total=$(python3 -c "import json; print(len(json.load(open('${planfile}'))))" 2>/dev/null)
          [ -z "${total}" ] && total=$(wc -l < "${joblog}" | tr -d ' ')
          artifactdir="LibreELEC.tv/${{ env.TARGETBUILDDIR }}/artifact"
          text="*${title}* (${{ env.LE_DISTRO_VERSION }})\n"
          while IFS= read -r line; do
            step=$(awk '{ print $2 }' <<< "${line}")
            pkg=$(awk '{ print $5 }' <<< "${line}")
            logpath=$(awk '{ print $12 }' <<< "${line}")
            pkgsafe="${pkg//:/_}"
            logfile="${artifactdir}/${{ env.TARGETBUILDDIR }}-${pkgsafe}-$(basename "${logpath}")"
            text+="step [${step}/${total}] ${pkg}\n"
            if [ -f "${logfile}" ]; then
              logtail=$(tail -50 "${logfile}")
              if echo "${logtail}" | grep -qE "^FAILED:|command not found"; then
                reason="BUILD"
              else
                reason=$(echo "${logtail}" | grep -ohE "APPLY PATCH|CONFIGURE|CMAKE|UNPACK" | tail -1)
              fi
              if [ -z "${reason}" ]; then
                reason=$(echo "${logtail}" | grep -oE "cannot stat '[^']+'" | tail -1 | sed "s|cannot stat '||;s|.*/||;s|'||")
              fi
              [ -n "${reason}" ] && text+="reason for failure - ${reason}\n"
            fi
          done <<< "${failed_lines}"
          text+="<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          {
            echo "has_failures=true"
            echo "text<<EOF"
            echo "${text}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Notify failed mesa builds
        if: steps.failures.outputs.has_failures == 'true'
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            username: "ADDON Bot"
            icon_emoji: ":ghost:"
            channel: "${{ secrets.ADDONS_REPO_WEBHOOK_CHANNEL }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":red_circle: Build failures"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ steps.failures.outputs.text }}"

      - name: Clean up - remove docker image tag
        if: always()
        run: |
          cd LibreELEC.tv
          docker image rm -f gh-${{ github.run_id }}

      - name: List files in target
        if: steps.failures.outputs.has_failures != 'true'
        run: |
          cd LibreELEC.tv
          ls -lah target/

      - name: upload reusable mesa:host tools
        if: steps.failures.outputs.has_failures != 'true'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: LibreELEC.tv/target/mesa-reusable-${{ inputs.version }}-${{ inputs.mesa }}-${{ inputs.arch }}.tar
          asset_content_type: application/tar
          github_token: ${{ github.token }}

      - name: upload reusable mesa:host tools sha256
        if: steps.failures.outputs.has_failures != 'true'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: LibreELEC.tv/target/mesa-reusable-${{ inputs.version }}-${{ inputs.mesa }}-${{ inputs.arch }}.tar.sha256
          asset_content_type: text/plain
          github_token: ${{ github.token }}

      - name: Notify job failure
        if: failure() && steps.failures.outputs.has_failures != 'true'
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.ADDONS_REPO_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            username: "ADDON Bot"
            icon_emoji: ":ghost:"
            channel: "${{ secrets.ADDONS_REPO_WEBHOOK_CHANNEL }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":red_circle: Job failed"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ inputs.group }}*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
